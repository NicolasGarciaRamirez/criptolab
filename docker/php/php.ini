memory_limit = 512M
upload_max_filesize = 32M
post_max_size = 32M
max_execution_time = 180
max_input_time = 180
display_errors = Off
log_errors = On
expose_php = Off
date.timezone = America/Bogota

opcache.enable = 1
opcache.validate_timestamps = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
